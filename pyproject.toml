[project]
name = "accentsbot"
version = "0.1.0"
description = "Telegram trainer for Russian EGE accents and paronyms"
requires-python = ">=3.13,<3.15"
dependencies = [
    "aiogram==3.26.0",
    "aiogram-dialog==2.6.0",
    "aiohttp==3.13.5",
    "alembic==1.18.4",
    "asyncpg==0.31.0",
    "click==8.1.8",
    "environs==14.6.0",
    "redis==7.3.0",
    "SQLAlchemy==2.0.48",
    "spacy==3.8.11",
    "ru-core-news-md @ https://github.com/explosion/spacy-models/releases/download/ru_core_news_md-3.8.0/ru_core_news_md-3.8.0-py3-none-any.whl",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["infrastructure/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
